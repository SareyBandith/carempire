{% extends "base.html" %}

{% block title %}All cars — CarEmpire{% endblock %}

{% block content %}
<h1 class="mb-4">Cars</h1>

<ul>
{% for car in cars %}
    <li>
        <a href="{% url 'car_detail' car.id %}">
            {{ car.year }} {{ car.brand.name }} {{ car.model_name }}
        </a>
        — ${{ car.price }}
    </li>
{% empty %}
    <li>No cars yet.</li>
{% endfor %}
</ul>
{% endblock %}
